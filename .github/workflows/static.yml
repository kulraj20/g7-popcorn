name: Deploy React App to GitHub Pages

on:
  push:
    branches: [Prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      VITE_BACK4APP_APPLICATION_ID: ${{ secrets.VITE_BACK4APP_APPLICATION_ID }}
      VITE_BACK4APP_JAVASCRIPT_KEY: ${{ secrets.VITE_BACK4APP_JAVASCRIPT_KEY }}
      VITE_BACK4APP_SERVER_URL: ${{ secrets.VITE_BACK4APP_SERVER_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Back4App configuration
        run: |
          status=0
          if [ ${#VITE_BACK4APP_APPLICATION_ID} -ge 8 ]; then
            echo "VITE_BACK4APP_APPLICATION_ID: OK"
          else
            echo "::error::VITE_BACK4APP_APPLICATION_ID is missing or too short (expected >= 8 chars)"
            status=1
          fi

          if [ ${#VITE_BACK4APP_JAVASCRIPT_KEY} -ge 8 ]; then
            echo "VITE_BACK4APP_JAVASCRIPT_KEY: OK"
          else
            echo "::error::VITE_BACK4APP_JAVASCRIPT_KEY is missing or too short (expected >= 8 chars)"
            status=1
          fi

          if [ -n "$VITE_BACK4APP_SERVER_URL" ]; then
            echo "VITE_BACK4APP_SERVER_URL: OK (custom)"
          else
            echo "VITE_BACK4APP_SERVER_URL: OK (using default)"
          fi

          exit $status

      - name: Build React app
        run: npm run build -- --base=/g7-popcorn/

      - name: Verify build files
        run: test -f dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Wait for artifact indexing
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
